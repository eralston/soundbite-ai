			function onDurationChanged(event) {
				let d = document.getElementById("durationOutput");
				d.innerHTML = "Duration: " + event.target.duration;

				if (event.target.duration == Infinity) {
					d.innerHTML = "Duration: infinity and beyond";
				}


				

			}
		</script>



		<div id="durationOutput">asdfasdf</div>
		<video src="NoDuration.webm" controls="controls" ondurationchange="onDurationChanged(event)" />
